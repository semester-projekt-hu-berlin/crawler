name: Crawl comments

on:
  schedule:
    # every 12 hours at 04:17 and 16:17 UTC (05:17 / 17:17 Berlin in winter);
    # analysis runs about an hour later. Minute 17 avoids the top-of-the-hour rush.
    # Fallback only: Vercel Cron (api repo) dispatches the same slots on time; see the gate job.
    - cron: "17 4,16 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma separated source ids or 'all'"
        default: "all"
      max_articles:
        description: "Max articles per source (new + revisited)"
        default: "500"
      since_hours:
        description: "Discover articles from the last H hours"
        default: "48"
      trigger:
        description: "Set to vercel-cron by the API's Vercel Cron (enables duplicate detection); leave empty for manual runs"
        default: ""

# Never run two crawls at the same time (idempotent anyway, but doubles the load on the sites).
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The GitHub `schedule` is only a fallback: on busy days it starts hours late, so Vercel Cron
  # (api repo, vercel.json) dispatches this workflow with trigger=vercel-cron. This job skips a
  # scheduled run if its slot was already handled, and drops duplicate cron deliveries.
  gate:
    if: github.event_name == 'schedule' || inputs.trigger == 'vercel-cron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if this slot already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW: crawl.yml
          JOB: crawl
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          fail_open() { echo "::warning::Duplicate check failed ($1), running anyway."; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }

          created=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .created_at) || fail_open "run lookup"
          now=$(date -u -d "$created" +%s) || fail_open "date"

          # Look-back window. Schedule: from 1 h before the slot this run belongs to (GitHub may start it
          # hours late; Vercel fires anywhere in the slot's hour). Cron dispatch: 3 h (duplicate deliveries).
          since=$((now - 4 * 3600))
          if [ "$EVENT" = schedule ]; then
            read -r min hours _ <<< "$SCHEDULE"
            if [[ "$min" =~ ^[0-9]+$ && "$hours" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              slot=0
              for d in "$(date -u -d "@$now" +%F)" "$(date -u -d "@$((now - 86400))" +%F)"; do
                for h in ${hours//,/ }; do
                  t=$(date -u -d "$d $((10#$h)):$((10#$min)):00" +%s)
                  if [ "$t" -le "$now" ] && [ "$t" -gt "$slot" ]; then slot=$t; fi
                done
              done
              [ "$slot" -gt 0 ] && since=$((slot - 3600))
            fi
          else
            since=$((now - 3 * 3600))
          fi
          since_iso=$(date -u -d "@$since" +%FT%TZ)
          echo "This run: $EVENT, created $created; looking for other runs created since $since_iso"

          runs=$(gh api -X GET "$api/workflows/$WORKFLOW/runs" -f created=">=$since_iso" -F per_page=50 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | [.id, .status, (.conclusion // \"-\"), .event, .created_at] | @tsv") || fail_open "run list"

          skip=false
          while IFS=$'\t' read -r id status conclusion event at; do
            [ -n "$id" ] || continue
            echo "  run $id: $event, created $at, $status/$conclusion"
            if [ "$status" != completed ]; then
              skip=true; reason="run $id ($event, created $at) is $status"; break
            fi
            if [ "$conclusion" = success ]; then
              # a run whose main job was skipped by this gate also ends as "success": check the job itself
              job=$(gh api "$api/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"$JOB\") | .conclusion] | first // \"-\"") || fail_open "job lookup"
              if [ "$job" = success ]; then skip=true; reason="run $id ($event, created $at) succeeded"; break; fi
            fi
          done <<< "$runs"

          if [ "$skip" = true ]; then echo "::notice::Skipping: $reason."; else echo "No successful or running run in the window, running."; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  crawl:
    needs: gate
    # runs unless the gate found a duplicate (also when the gate was not needed or failed)
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Crawl
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOG_FORMAT: json
          SOURCES: ${{ inputs.sources || 'all' }}
          MAX_ARTICLES: ${{ inputs.max_articles || '500' }}
          SINCE_HOURS: ${{ inputs.since_hours || '48' }}
        run: |
          python -m crawler run \
            --sources "$SOURCES" \
            --max-articles "$MAX_ARTICLES" \
            --since-hours "$SINCE_HOURS" \
            --time-budget-minutes 95 \
            --summary-json run-summary.json

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: run-summary.json
          if-no-files-found: ignore
          retention-days: 14
